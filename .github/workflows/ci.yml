name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bh_user
          POSTGRES_PASSWORD: bh_pass
          POSTGRES_DB: broadcasthub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bh_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bh_user:bh_pass@localhost:5432/broadcasthub
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'test-refresh-secret' }}
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: 587
      SMTP_USER: test@test.com
      SMTP_PASS: test
      PORT: 4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: apps/api
        run: npm install

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Run unit tests with coverage
        working-directory: apps/api
        run: npm run test:cov

      - name: Seed database
        working-directory: apps/api
        run: npm run seed

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 7
