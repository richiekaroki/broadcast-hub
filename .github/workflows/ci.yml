name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bh_user
          POSTGRES_PASSWORD: bh_pass
          POSTGRES_DB: broadcasthub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bh_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ connectionStatus: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      DATABASE_URL: postgres://bh_user:bh_pass@localhost:5432/broadcasthub
      MONGODB_URL: mongodb://localhost:27017/broadcasthub
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/v1/auth/google/callback
      FRONTEND_URL: http://localhost:3000
      PORT: 4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Run unit tests with coverage
        working-directory: apps/api
        run: npm run test:cov

      - name: Seed database
        working-directory: apps/api
        run: npm run seed

      - name: Run E2E tests
        working-directory: apps/api
        run: npm run test:e2e

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Build Docker image (API)
        working-directory: apps/api
        run: docker build -t broadcast-hub-api:${{ github.sha }} .

      - name: Build Docker image (Web)
        working-directory: apps/web
        run: docker build -t broadcast-hub-web:${{ github.sha }} .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 7